<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeNetDebugger</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0f14; }
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a0f14 0%, #111827 55%, #0a0f14 100%);
        transition: opacity .24s ease;
      }
      #startup-splash.fade-out { opacity: 0; pointer-events: none; }
      .startup-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 22px;
        border-radius: 12px;
        border: 1px solid rgba(45,212,191,.28);
        background: rgba(17,24,39,.82);
        box-shadow: 0 0 26px rgba(45,212,191,.14), inset 0 0 14px rgba(45,212,191,.08);
        color: #f1f5f9;
      }
      .startup-icon {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        border: 1px solid rgba(45,212,191,.35);
      }
      .startup-title {
        font: 700 16px "Inter", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: .04em;
        color: #2dd4bf;
      }
      .startup-subtitle {
        font: 500 11px "JetBrains Mono", "Consolas", monospace;
        color: rgba(148,163,184,.85);
      }
      .startup-bar {
        width: 170px;
        height: 3px;
        border-radius: 999px;
        background: rgba(148,163,184,.28);
        overflow: hidden;
      }
      .startup-bar > span {
        display: block;
        width: 44%;
        height: 100%;
        background: linear-gradient(90deg, #2dd4bf, #818cf8);
        animation: startup-slide 1.1s ease-in-out infinite;
      }
      @keyframes startup-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
    </style>
  </head>
  <body>
    <script>
      window.__startupSplashAt = Date.now();
    </script>
    <div id="startup-splash" aria-hidden="true">
      <div class="startup-card">
        <img class="startup-icon" src="/app-icon.png" alt="FreeNetDebugger" />
        <div class="startup-title">FreeNetDebugger</div>
        <div class="startup-subtitle">Initializing runtime...</div>
        <div class="startup-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
